# Provision a private scanner with at least 4 GiB RAM using deploy/clamav.Dockerfile.
# Set CLAMAV_HOST below to that service's private hostname; never use a public scanner port.
services:
  - type: web
    name: acadhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: TRUST_PROXY
        value: 1
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: 3310
