# Local development only. MongoDB is bound to loopback and must not be exposed publicly.
services:
  mongo:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  clamav:
    image: clamav/clamav:1.4
    profiles: ['scanner']
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
volumes:
  mongo-data:
  clamav-data:
